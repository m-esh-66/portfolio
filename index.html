<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Portfolio" />
    <title>Marcus Eshleman</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />

    <script>
      // Apply the saved (or system) theme before first paint so the page never flashes.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('theme') ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <script src="content.js" defer></script>
    <script src="assets/js/main.js" defer></script>
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="container site-header__inner">
        <a class="brand" id="brand"></a>

        <nav class="nav" aria-label="Primary">
          <ul class="nav__list" id="nav-list">
            <li><a class="nav__link" href="#projects">Projects</a></li>
            <li><a class="nav__link" href="#skills">Skills</a></li>
            <li><a class="nav__link" href="#contact">Contact</a></li>
          </ul>

          <button class="icon-btn" type="button" id="theme-toggle" aria-label="toggle theme">
            <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
            </svg>
            <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
            </svg>
          </button>

          <button
            class="icon-btn nav__toggle"
            type="button"
            id="menu-toggle"
            aria-label="toggle navigation"
            aria-controls="nav-list"
            aria-expanded="false"
          >
            <svg class="icon icon--menu" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 6h16M4 12h16M4 18h16" />
            </svg>
            <svg class="icon icon--close" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        </nav>
      </div>
    </header>

    <main id="main">
      <section class="hero container" id="about"></section>

      <section class="section container" id="projects">
        <h2 class="section__title">Projects</h2>
        <div class="projects" id="project-list"></div>
      </section>

      <section class="section container" id="skills">
        <h2 class="section__title">Skills</h2>
        <ul class="chips" id="skill-list"></ul>
      </section>

      <section class="section container" id="contact">
        <div class="contact reveal">
          <h2 class="section__title">Contact</h2>
          <a class="btn btn--primary" id="contact-email">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="2" y="4" width="20" height="16" rx="2" />
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
            </svg>
            Email me
          </a>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <a class="site-footer__link" href="https://github.com/rjshkhr/cleanfolio">Marcus Eshleman</a>
    </footer>

    <a class="scroll-top" id="scroll-top" href="#top" aria-label="top">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="m5 12 7-7 7 7M12 19V5" />
      </svg>
    </a>

    <dialog class="lightbox" id="lightbox" aria-label="Enlarged image">
      <img alt="" />
      <button class="icon-btn lightbox__close" type="button" aria-label="Close">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </dialog>

    <noscript>You need to enable JavaScript to run this app</noscript>
  </body>
</html>
